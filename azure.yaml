# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: fussyeaterclub
metadata:
  template: fussyeater.club

services:
  api:
    project: ./api/FussyEaterClub.Api
    language: dotnet
    host: containerapp
    # Let AZD handle the build with ACR Tasks

  web:
    project: ./web
    language: js
    host: staticwebapp
    dist: build

infra:
  provider: bicep
  path: ./infra
  module: main

hooks:
  preprovision:
    shell: pwsh
    run: |
      Write-Host "Provisioning Azure resources..."
  postprovision:
    shell: pwsh
    run: |
      Write-Host "Resources provisioned successfully"
