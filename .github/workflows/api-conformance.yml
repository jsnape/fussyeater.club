name: API Type Generation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'specs/api/**'
      - 'src/lib/api-types.d.ts'

jobs:
  types:
    name: Verify Generated Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeSpec dependencies
        working-directory: specs/api
        run: npm ci

      - name: Compile TypeSpec
        working-directory: specs/api
        run: npx tsp compile .

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate TypeScript types
        run: npm run generate:types

      - name: Check for uncommitted type changes
        run: |
          if [ -n "$(git diff --name-only src/lib/api-types.d.ts)" ]; then
            echo "::error::src/lib/api-types.d.ts is out of date. Run 'npm run generate:types' and commit the result."
            git diff src/lib/api-types.d.ts
            exit 1
          fi
          echo "Generated types are up to date."
