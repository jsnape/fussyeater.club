name: Build & Test

on:
  workflow_dispatch
# TODO: Re-enable automatic triggers when ready for CI
#   pull_request:
#     branches: [main]
#   push:
#     branches: [main]

jobs:
  frontend:
    name: SvelteKit Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
