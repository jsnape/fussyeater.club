name: Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/FussyEaterClub.slnx

      - name: Build
        run: dotnet build src/FussyEaterClub.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/FussyEaterClub.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Format check
        run: dotnet format src/FussyEaterClub.slnx --verify-no-changes --verbosity diagnostic

  frontend:
    name: SvelteKit Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build
