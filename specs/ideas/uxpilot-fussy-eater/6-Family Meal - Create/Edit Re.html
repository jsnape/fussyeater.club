<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create / Edit Recipe - FussyEater Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script> window.FontAwesomeConfig = { autoReplaceSvg: 'nest'};</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#B22222',
                            cream: '#FDFBF7',
                            sand: '#F5F5F5',
                            charcoal: '#2D2D2D',
                            mustard: '#E8B031',
                            sage: '#8BA888'
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { margin: 0; padding: 0; background-color: #FDFBF7; }
        .smooth-shadow { box-shadow: 0 10px 30px -10px rgba(0,0,0,0.08); }
        .sticker-badge { 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom file input styling */
        input[type="file"]::file-selector-button {
            border: none;
            background: #F5F5F5;
            padding: 8px 16px;
            border-radius: 8px;
            color: #2D2D2D;
            cursor: pointer;
            font-weight: 500;
            margin-right: 12px;
            transition: background 0.2s;
        }
        input[type="file"]::file-selector-button:hover {
            background: #e5e5e5;
        }
    </style>
</head>
<body class="font-sans text-brand-charcoal antialiased m-0 p-0 overflow-x-hidden min-h-screen flex flex-col relative">

    <!-- Shared Navigation Header -->
    <header id="main-header" class="w-full bg-brand-cream/90 backdrop-blur-md sticky top-0 z-50 border-b border-brand-sand shadow-sm">
        <div class="max-w-7xl mx-auto px-6 lg:px-12 h-20 flex items-center justify-between">
            <a href="#" class="flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-bowl-food text-brand-red text-2xl"></i>
                <span class="font-serif text-2xl font-bold text-brand-red tracking-tight hidden sm:block">FussyEater Club</span>
            </a>
            
            <nav class="hidden md:flex items-center gap-6">
                <a href="#" class="text-sm font-bold text-brand-red border-b-2 border-brand-red pb-1">Recipes Browse</a>
                <a href="#" class="text-sm font-medium text-gray-500 hover:text-brand-charcoal transition-colors">Meal Planner</a>
                <a href="#" class="text-sm font-medium text-gray-500 hover:text-brand-charcoal transition-colors">Shopping List</a>
                <a href="#" class="text-sm font-medium text-gray-500 hover:text-brand-charcoal transition-colors">Household & Profiles</a>
                <a href="#" class="text-sm font-medium text-gray-500 hover:text-brand-charcoal transition-colors">Account & Preferences</a>
            </nav>

            <button class="md:hidden text-brand-charcoal text-xl">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-[1440px] mx-auto w-full px-4 sm:px-6 lg:px-12 py-8 relative z-10 flex flex-col gap-8">
        
        <!-- Editor Header (Sticky) -->
        <div class="sticky top-20 z-40 bg-brand-cream/95 backdrop-blur py-4 border-b border-brand-sand flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 -mx-4 px-4 sm:-mx-6 sm:px-6 lg:-mx-12 lg:px-12">
            <div class="flex-1 w-full">
                <input type="text" placeholder="Recipe Title..." class="w-full bg-transparent font-serif text-3xl lg:text-4xl font-bold text-brand-charcoal placeholder-gray-300 focus:outline-none focus:ring-0 border-none p-0" value="Crispy Chicken & Buttered Pasta">
                <div class="flex items-center gap-2 mt-2">
                    <span class="text-xs text-brand-sage font-medium flex items-center gap-1"><i class="fa-solid fa-cloud-arrow-up"></i> Autosaved just now</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto shrink-0">
                <button class="flex-1 sm:flex-none px-4 py-2.5 rounded-[12px] border border-gray-200 text-sm font-medium text-brand-charcoal hover:bg-gray-50 transition-colors bg-white shadow-sm">
                    Save Draft
                </button>
                <button class="flex-1 sm:flex-none px-4 py-2.5 rounded-[12px] border border-brand-charcoal text-sm font-medium text-brand-charcoal hover:bg-gray-50 transition-colors bg-white shadow-sm">
                    Preview Draft
                </button>
                <button class="flex-1 sm:flex-none px-6 py-2.5 rounded-[12px] bg-brand-red text-white text-sm font-bold hover:bg-brand-red/90 transition-colors shadow-sm">
                    Publish
                </button>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            
            <!-- Left Column: Metadata & Setup -->
            <div class="w-full lg:w-[400px] shrink-0 flex flex-col gap-6">
                
                <!-- Photo Upload -->
                <div class="bg-white rounded-[24px] p-6 border border-gray-100 smooth-shadow">
                    <h3 class="text-sm font-bold text-brand-charcoal mb-4">Cover Photo</h3>
                    <div class="w-full h-48 border-2 border-dashed border-brand-sand rounded-[16px] bg-gray-50 flex flex-col items-center justify-center text-center p-4 relative overflow-hidden group cursor-pointer hover:bg-gray-100 transition-colors">
                        <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/1714f5f3ae-af32ff48f79d274e38d1.png" alt="Recipe cover" class="absolute inset-0 w-full h-full object-cover opacity-50 group-hover:opacity-30 transition-opacity">
                        <div class="relative z-10 flex flex-col items-center">
                            <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-brand-charcoal shadow-sm mb-2">
                                <i class="fa-solid fa-camera"></i>
                            </div>
                            <span class="text-sm font-medium text-brand-charcoal bg-white/80 px-2 py-1 rounded">Change Photo</span>
                        </div>
                    </div>
                </div>

                <!-- Core Details -->
                <div class="bg-white rounded-[24px] p-6 border border-gray-100 smooth-shadow">
                    <h3 class="text-sm font-bold text-brand-charcoal mb-4">Core Details</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Summary / Description</label>
                            <textarea rows="3" class="w-full bg-brand-sand/30 border border-gray-200 rounded-[12px] p-3 text-sm text-brand-charcoal focus:outline-none focus:border-brand-mustard focus:ring-1 focus:ring-brand-mustard resize-none" placeholder="A reliable favorite that combines...">A reliable favorite that combines the ultimate safe food (buttered pasta) with a homemade, extra-crunchy take on chicken tenders.</textarea>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-gray-500 mb-1">Prep Time (min)</label>
                                <div class="relative">
                                    <i class="fa-solid fa-clock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                                    <input type="number" value="15" class="w-full bg-brand-sand/30 border border-gray-200 rounded-[12px] py-2.5 pl-9 pr-3 text-sm text-brand-charcoal focus:outline-none focus:border-brand-mustard focus:ring-1 focus:ring-brand-mustard">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-500 mb-1">Cook Time (min)</label>
                                <div class="relative">
                                    <i class="fa-solid fa-fire-burner absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                                    <input type="number" value="20" class="w-full bg-brand-sand/30 border border-gray-200 rounded-[12px] py-2.5 pl-9 pr-3 text-sm text-brand-charcoal focus:outline-none focus:border-brand-mustard focus:ring-1 focus:ring-brand-mustard">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-500 mb-1">Servings</label>
                                <div class="relative">
                                    <i class="fa-solid fa-users absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                                    <input type="number" value="4" class="w-full bg-brand-sand/30 border border-gray-200 rounded-[12px] py-2.5 pl-9 pr-3 text-sm text-brand-charcoal focus:outline-none focus:border-brand-mustard focus:ring-1 focus:ring-brand-mustard">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sensory Profile -->
                <div class="bg-white rounded-[24px] p-6 border border-gray-100 smooth-shadow">
                    <h3 class="text-sm font-bold text-brand-charcoal mb-4">Sensory Profile</h3>
                    
                    <div class="mb-5">
                        <label class="block text-xs font-medium text-gray-500 mb-2">Dominant Textures</label>
                        <div class="flex flex-wrap gap-2">
                            <button class="px-3 py-1.5 rounded-[8px] text-xs font-medium border border-brand-mustard bg-brand-mustard/10 text-brand-mustard transition-colors">Crunchy</button>
                            <button class="px-3 py-1.5 rounded-[8px] text-xs font-medium border border-brand-sage bg-brand-sage/10 text-brand-sage transition-colors">Smooth</button>
                            <button class="px-3 py-1.5 rounded-[8px] text-xs font-medium border border-gray-200 text-gray-500 hover:bg-gray-50 transition-colors">Soft</button>
                            <button class="px-3 py-1.5 rounded-[8px] text-xs font-medium border border-gray-200 text-gray-500 hover:bg-gray-50 transition-colors">Chewy</button>
                            <button class="px-3 py-1.5 rounded-[8px] text-xs font-medium border border-gray-200 text-gray-500 hover:bg-gray-50 transition-colors">Mixed</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-2">Contains Allergens (Tags)</label>
                        <div class="min-h-[42px] w-full bg-brand-sand/30 border border-gray-200 rounded-[12px] p-1.5 flex flex-wrap gap-1.5 items-center">
                            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-[6px] bg-brand-red/10 text-brand-red text-xs font-medium border border-brand-red/20">
                                Dairy <button class="hover:text-brand-red/70"><i class="fa-solid fa-xmark text-[10px]"></i></button>
                            </span>
                            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-[6px] bg-brand-red/10 text-brand-red text-xs font-medium border border-brand-red/20">
                                Gluten <button class="hover:text-brand-red/70"><i class="fa-solid fa-xmark text-[10px]"></i></button>
                            </span>
                            <input type="text" placeholder="Add allergen..." class="bg-transparent border-none focus:outline-none text-xs w-24 p-1">
                        </div>
                    </div>
                </div>

            </div>

            <!-- Right Column: Content Builder -->
            <div class="flex-1 flex flex-col gap-6">
                
                <!-- Ingredients Builder -->
                <div class="bg-white rounded-[24px] p-6 lg:p-8 border border-gray-100 smooth-shadow">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-serif font-bold text-brand-charcoal">Ingredients</h3>
                        <button class="text-sm font-bold text-brand-mustard hover:text-brand-mustard/80 transition-colors flex items-center gap-1.5">
                            <i class="fa-solid fa-plus"></i> Add Item
                        </button>
                    </div>

                    <div class="space-y-3">
                        <!-- Ingredient Row -->
                        <div class="flex items-start gap-3 p-3 bg-brand-sand/10 rounded-[12px] border border-gray-100 group">
                            <div class="pt-2 cursor-grab text-gray-300 hover:text-gray-500"><i class="fa-solid fa-grip-vertical"></i></div>
                            <div class="flex-1 grid grid-cols-12 gap-3">
                                <div class="col-span-3 sm:col-span-2">
                                    <input type="text" value="1" class="w-full bg-white border border-gray-200 rounded-[8px] px-3 py-2 text-sm focus:outline-none focus:border-brand-mustard" placeholder="Qty">
                                </div>
                                <div class="col-span-4 sm:col-span-3">
                                    <select class="w-full bg-white border border-gray-200 rounded-[8px] px-3 py-2 text-sm focus:outline-none focus:border-brand-mustard text-brand-charcoal appearance-none">
                                        <option>lb</option>
                                        <option>cup</option>
                                        <option>tbsp</option>
                                        <option>oz</option>
                                    </select>
                                </div>
                                <div class="col-span-12 sm:col-span-7">
                                    <input type="text" value="Chicken Breast, cut into strips" class="w-full bg-white border border-gray-200 rounded-[8px] px-3 py-2 text-sm focus:outline-none focus:border-brand-mustard" placeholder="Ingredient name">
                                </div>
                            </div>
                            <button class="pt-2 text-gray-400 hover:text-brand-red opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-solid fa-trash-can"></i></button>
                        </div>

                        <!-- Ingredient Row -->
                        <div class="flex items-start gap-3 p-3 bg-brand-sand/10 rounded-[12px] border border-gray-100 group">
                            <div class="pt-2 cursor-grab text-gray-300 hover:text-gray-500"><i class="fa-solid fa-grip-vertical"></i></div>
                            <div class="flex-1 grid grid-cols-12 gap-3">
                                <div class="col-span-3 sm:col-span-2">
                                    <input type="text" value="1" class="w-full bg-white border border-gray-200 rounded-[8px] px-3 py-2 text-sm focus:outline-none focus:border-brand-mustard" placeholder="Qty">
                                </div>
                                <div class="col-span-4 sm:col-span-3">
                                    <select class="w-full bg-white border border-gray-200 rounded-[8px] px-3 py-2 text-sm focus:outline-none focus:border-brand-mustard text-brand-charcoal appearance-none">
                                        <option>cup</option>
                                        <option>lb</option>
                                        <option>tbsp</option>
                                        <option>oz</option>
                                    </select>
                                </div>
                                <div class="col-span-12 sm:col-span-7">
                                    <input type="text" value="Panko Breadcrumbs" class="w-full bg-white border border-gray-200 rounded-[8px] px-3 py-2 text-sm focus:outline-none focus:border-brand-mustard" placeholder="Ingredient name">
                                </div>
                            </div>
                            <button class="pt-2 text-gray-400 hover:text-brand-red opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Instructions Builder -->
                <div class="bg-white rounded-[24px] p-6 lg:p-8 border border-gray-100 smooth-shadow">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-serif font-bold text-brand-charcoal">Step-by-Step Instructions</h3>
                        <button class="text-sm font-bold text-brand-mustard hover:text-brand-mustard/80 transition-colors flex items-center gap-1.5">
                            <i class="fa-solid fa-plus"></i> Add Step
                        </button>
                    </div>

                    <div class="space-y-6">
                        <!-- Step Block -->
                        <div class="relative pl-10">
                            <div class="absolute left-0 top-0 w-7 h-7 rounded-full bg-brand-charcoal text-white text-xs font-bold flex items-center justify-center">1</div>
                            <div class="bg-gray-50 rounded-[16px] border border-gray-100 p-4 space-y-3 relative group">
                                <div class="absolute right-3 top-3 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button class="text-gray-400 hover:text-brand-charcoal"><i class="fa-solid fa-arrow-up text-xs"></i></button>
                                    <button class="text-gray-400 hover:text-brand-charcoal"><i class="fa-solid fa-arrow-down text-xs"></i></button>
                                    <button class="text-gray-400 hover:text-brand-red"><i class="fa-solid fa-trash-can text-xs"></i></button>
                                </div>
                                <input type="text" value="Prep the oven and pasta water" class="w-full bg-transparent font-bold text-sm text-brand-charcoal placeholder-gray-400 focus:outline-none border-b border-transparent focus:border-gray-200 pb-1 pr-16" placeholder="Step title (optional)">
                                <textarea rows="2" class="w-full bg-white border border-gray-200 rounded-[12px] p-3 text-sm text-brand-charcoal focus:outline-none focus:border-brand-mustard resize-none" placeholder="Describe this step...">Preheat your oven to 400°F (200°C). Line a baking sheet with parchment paper. Meanwhile, bring a large pot of salted water to a boil for the pasta.</textarea>
                                
                                <!-- Sensory Note Sub-field -->
                                <div class="bg-brand-mustard/5 rounded-[8px] p-3 border border-brand-mustard/20 flex gap-2 items-start mt-2">
                                    <i class="fa-solid fa-lightbulb text-brand-mustard mt-0.5"></i>
                                    <div class="flex-1">
                                        <input type="text" placeholder="Add a sensory-friendly note (e.g., 'Keep crunchy')" class="w-full bg-transparent text-xs text-brand-charcoal focus:outline-none placeholder-gray-400">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Step Block -->
                        <div class="relative pl-10">
                            <div class="absolute left-0 top-0 w-7 h-7 rounded-full bg-brand-charcoal text-white text-xs font-bold flex items-center justify-center">2</div>
                            <div class="bg-gray-50 rounded-[16px] border border-gray-100 p-4 space-y-3 relative group">
                                <div class="absolute right-3 top-3 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button class="text-gray-400 hover:text-brand-charcoal"><i class="fa-solid fa-arrow-up text-xs"></i></button>
                                    <button class="text-gray-400 hover:text-brand-charcoal"><i class="fa-solid fa-arrow-down text-xs"></i></button>
                                    <button class="text-gray-400 hover:text-brand-red"><i class="fa-solid fa-trash-can text-xs"></i></button>
                                </div>
                                <input type="text" value="Coat the chicken" class="w-full bg-transparent font-bold text-sm text-brand-charcoal placeholder-gray-400 focus:outline-none border-b border-transparent focus:border-gray-200 pb-1 pr-16" placeholder="Step title (optional)">
                                <textarea rows="2" class="w-full bg-white border border-gray-200 rounded-[12px] p-3 text-sm text-brand-charcoal focus:outline-none focus:border-brand-mustard resize-none" placeholder="Describe this step...">Dip each chicken strip into a shallow bowl of safe liquid, then roll tightly in the panko breadcrumbs until fully coated.</textarea>
                                
                                <!-- Sensory Note Sub-field -->
                                <div class="bg-brand-mustard/5 rounded-[8px] p-3 border border-brand-mustard/20 flex gap-2 items-start mt-2">
                                    <i class="fa-solid fa-lightbulb text-brand-mustard mt-0.5"></i>
                                    <div class="flex-1">
                                        <input type="text" value="Ensure the coating is even. Bare spots can feel 'slimy' compared to the crunchy parts." class="w-full bg-transparent text-xs text-brand-charcoal focus:outline-none font-medium">
                                    </div>
                                    <button class="text-brand-mustard hover:text-brand-mustard/70"><i class="fa-solid fa-xmark text-xs"></i></button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- Shared Footer -->
    <footer id="main-footer" class="w-full py-8 text-center bg-brand-cream border-t border-brand-sand z-10 mt-auto">
        <p class="text-xs text-gray-500">© 2024 FussyEater Club. Safe, stress-free meal planning.</p>
    </footer>

</body>
</html>
